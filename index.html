<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᴘʀɪᴍᴇʟᴏᴄᴋW - KAMEN RIDER W</title>
    <!-- ICON TRÊN TAB TRÌNH DUYỆT: ĐÃ GẮN SẴN LINK ẢNH MẶT NẠ -->
    <link rel="icon" href="https://i.postimg.cc/qRHxBchT/image1-jpg.jpg" type="image/jpeg">
    <style>
        /* CSS RESET & VARIABLES */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        :root {
            --primary: #ff003c;
            --secondary: #00ffcc;
            --bg-dark: #050505;
            --panel-bg: rgba(10, 10, 10, 0.85);
            --border-glow: rgba(255, 0, 60, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BACKGROUND IMAGES */
        .bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            opacity: 0.7; 
            filter: blur(1px) brightness(0.8); 
            transition: opacity 0.5s ease;
        }

        /* SCANLINES & CRT EFFECT */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* SCREENS */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .screen.active { display: flex; }

        /* LOGIN PANEL */
        .login-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.2), inset 0 0 20px rgba(255, 0, 60, 0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 420px;
            max-width: 90%;
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* TARGET LOCK-ON ANIMATION */
        .login-panel::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border: 2px solid rgba(255, 0, 60, 0.25);
            border-radius: 50%;
            pointer-events: none;
            animation: pulse-ring 3s linear infinite;
            z-index: -1;
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }

        /* TEXT EFFECTS */
        .glitch-text {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 12px;
            margin-bottom: 30px;
            letter-spacing: 3px;
            font-weight: bold;
        }

        /* INPUT GROUP */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            background: rgba(0,0,0,0.6);
            border: 1px solid #333;
            padding: 14px;
            color: #fff;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            text-align: center;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }

        button {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .get-key-btn {
            border-color: #ffaa00;
            color: #ffaa00;
            font-size: 13px;
            width: 100%;
        }

        .get-key-btn:hover {
            background: #ffaa00;
            box-shadow: 0 0 20px #ffaa00;
            color: #000;
        }

        .buy-btn {
            border-color: var(--secondary);
            color: var(--secondary);
            font-size: 13px;
            width: 100%;
        }

        .buy-btn:hover {
            background: var(--secondary);
            box-shadow: 0 0 20px var(--secondary);
            color: #000;
        }

        /* ROUND TOGGLE SWITCH */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: #fff;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* MAIN PANEL */
        .main-container {
            width: 92%;
            max-width: 1100px;
            height: 90vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.15);
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        /* CSS LOGO MẶT NẠ */
        .logo-container img {
            width: 50px;
            height: 50px;
            border-radius: 50%; /* Bo tròn logo */
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
        }

        .header-title {
            font-size: 20px;
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 1px;
        }
        .header-title span { color: var(--secondary); font-size: 14px; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #user-key-type {
            color: var(--secondary);
            font-weight: bold;
            font-size: 13px;
            border: 1px solid var(--secondary);
            padding: 6px 12px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            letter-spacing: 1px;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: #888;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(255, 0, 60, 0.1);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.2);
            font-weight: bold;
        }

        /* TAB CONTENT */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .tab-content::-webkit-scrollbar { width: 6px; }
        .tab-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 6px; }

        /* GRID FOR TOGGLES */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #222;
            padding: 12px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .toggle-item:hover {
            border-color: rgba(255, 0, 60, 0.5);
            background: rgba(255, 0, 60, 0.05);
        }

        .toggle-item span {
            font-size: 12px;
            font-weight: bold;
            color: #ccc;
            letter-spacing: 0.5px;
        }

        /* WEAPON SECTION */
        .weapon-optimize-section {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
            margin-bottom: 20px;
        }

        .weapon-optimize-section h3 {
            color: var(--secondary);
            margin-bottom: 15px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .weapon-select-container {
            display: flex;
            gap: 15px;
            align-items: stretch;
            flex-wrap: wrap;
        }

        select {
            flex: 1;
            background: rgba(0,0,0,0.8);
            color: var(--secondary);
            border: 1px solid var(--secondary);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            min-width: 250px;
            font-size: 14px;
        }

        select option {
            padding: 5px;
            background: #111;
        }

        #optimize-all-btn {
            border-color: var(--secondary);
            color: var(--secondary);
            padding: 10px 25px;
            white-space: nowrap;
        }

        #optimize-all-btn:hover {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 20px var(--secondary);
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--secondary);
            color: #000;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 0 20px var(--secondary);
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s;
            z-index: 9999;
            font-size: 14px;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* HIỆU ỨNG CHỮ VÔ GAME BÁ SÀN */
        .bypass-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .bypass-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .bypass-text {
            font-size: 45px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #ff003c;
            letter-spacing: 3px;
            animation: glitch-anim 0.2s infinite alternate;
            text-align: center;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c; }
            40% { transform: translate(3px, -2px); text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; }
            60% { transform: translate(-2px, -1px); }
            80% { transform: translate(2px, 1px); }
            100% { transform: translate(0); text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #ff003c; }
        }

        /* HIỆU ỨNG CHỮ BÁ KHI BẬT AIM/ANTIBAN */
        .ba-overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .ba-overlay.active { opacity: 1; }
        
        .ba-text {
            font-size: 100px;
            font-weight: 900;
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00, 0 0 50px #ff003c;
            animation: pop-ba 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop-ba {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .version {
            font-size: 10px;
            color: #555;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; text-align: center; }
            .grid-container { grid-template-columns: 1fr; }
            .main-container { padding: 15px; }
            .tabs { flex-wrap: wrap; }
            .ba-text { font-size: 60px; }
        }
    </style>
</head>
<body>
    <!-- BACKGROUND IMAGES -->
    <div class="bg-image" id="bg-login" style="background-image: url('https://i.postimg.cc/qRHxBchT/image1-jpg.jpg');"></div>

            </div>

            <!-- TAB AIM -->
            <div class="tab-content" id="aim-tab">
                <div class="grid-container" id="aim-grid"></div>
            </div>

            <!-- TAB TỐI ƯU MÁY -->
            <div class="tab-content" id="optimize-tab" style="display: none;">
                <div class="grid-container" id="optimize-grid"></div>
                
                <div class="weapon-optimize-section">

                    <div class="weapon-select-container">
                        <select id="weapon-select" multiple size="5">

                        </select>
                        <button id="optimize-all-btn">TỐI ƯU TẤT CẢ SÚNG</button>
                    </div>
                </div>
            </div>

            <!-- TAB ANTIBAN -->
            <div class="tab-content" id="antiban-tab" style="display: none;">
                <div class="grid-container" id="antiban-grid"></div>
            </div>
        </div>
    </div>

    <!-- BYPASS OVERLAY -->
    <div class="bypass-overlay" id="bypass-overlay">
        <div class="bypass-text">VÔ GAME BÁ SÀN @@@XIÊM</div>
    </div>

    <!-- BÁ OVERLAY (Dành cho AIM & ANTIBAN) -->
    <div class="ba-overlay" id="ba-overlay">
        <div class="ba-text">BÁ</div>
    </div>

    <script>
        // --- DATA ---
        const aimFeatures = [
            "AIMHEAD", "AIMNECK", "AIMLOCK", "KHOÁ TÂM", "LOCKHEAD", "AIM NGỰC", 
            "NHẸ TÂM", "BÁM ĐẦU", "ĐẦM TÂM", "HEADSHOT 50%", "AUTO AIM", 
            "SENSI PRO", "FIX RUNG TÂM", "AIMBOT", "AIMSMOOTH", "AIMLOCK PRO", "SHOTBOT",
            "REGDIT", "LOCK HEAD V6", "REGLOCK", "GHIM ĐẦU", "GHIM CỔ", "FIX ĐẠN LẠC", "AUTO HEADSHOT"
        ];

        const optimizeFeatures = [
            "MỞ KHOÁ 120 FPS", "TĂNG TỐC GAME", "MỞ KHOÁ 120HZ", 
            "TỐI ƯU CPU", "TĂNG TỐC KẾT NỐI MẠNG", "TỐI ƯU BỘ NHỚ RAM",
            "TĂNG NHẠY CHO MÁY", "HỖ TRỢ KÉO TÂM", "TỐI ƯU CẤU HÌNH MÁY", "TỐI ƯU CHIP",
            "NHẠY MÀN"
        ];

        const antibanFeatures = [
            "ANTICHEAT", "ANTIBAN", "FIX BAN", "BYPASS"
        ];

        const weapons = [
            "MP40", "M4A1", "AK47", "M1014", "UMP", "SCAR", "AWM", "Kar98k", 
            "Woodpecker", "SKS", "M14", "M1887", "M249", "M60", "Thompson", 
            "P90", "MP5", "Vector", "Desert Eagle", "USP", "Glock", "FAMAS", 
            "Groza", "M82B", "SVD", "SPAS12", "MAG-7", "UMP45", "AN94", 
            "M16A4", "M4A1-S", "SCAR-L", "M500"
        ];

        // --- DOM ELEMENTS ---
        const loginScreen = document.getElementById('login-screen');
        const mainScreen = document.getElementById('main-screen');
        const keyInput = document.getElementById('key-input');
        const loginBtn = document.getElementById('login-btn');
        const buyKeyBtn = document.getElementById('buy-key-btn');
        const loginGetKeyBtn = document.getElementById('login-get-key-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userKeyType = document.getElementById('user-key-type');
        const bgLogin = document.getElementById('bg-login');
        const bgMain = document.getElementById('bg-main');
        const bypassOverlay = document.getElementById('bypass-overlay');
        const baOverlay = document.getElementById('ba-overlay');

        // --- CREATE TOGGLE COMPONENT ---
        function createToggle(labelText, type = "normal") {
            const div = document.createElement('div');
            div.className = 'toggle-item';
            
            const span = document.createElement('span');
            span.textContent = labelText;
            
            const switchLabel = document.createElement('label');
            switchLabel.className = 'switch';
            
            const input = document.createElement('input');
            input.type = 'checkbox';
            
            if (type === "bypass") {
                input.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        bypassOverlay.classList.add('active');
                        setTimeout(() => bypassOverlay.classList.remove('active'), 2500);
                    }
                });
            } else if (type === "aim" || type === "antiban") {
                input.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        baOverlay.classList.add('active');
                        setTimeout(() => baOverlay.classList.remove('active'), 800);
                    }
                });
            }
            
            const slider = document.createElement('span');
            slider.className = 'slider round';
            
            switchLabel.appendChild(input);
            switchLabel.appendChild(slider);
            
            div.appendChild(span);
            div.appendChild(switchLabel);
            
            return div;
        }

        // --- INIT UI ---
        function initUI() {
            const aimGrid = document.getElementById('aim-grid');
            aimFeatures.forEach(feature => {
                aimGrid.appendChild(createToggle(feature, "aim"));
            });

            const optimizeGrid = document.getElementById('optimize-grid');
            optimizeFeatures.forEach(feature => {
                optimizeGrid.appendChild(createToggle(feature, "normal"));
            });

            const antibanGrid = document.getElementById('antiban-grid');
            antibanFeatures.forEach(feature => {
                let type = feature === "BYPASS" ? "bypass" : "antiban";
                antibanGrid.appendChild(createToggle(feature, type));
            });

            const weaponSelect = document.getElementById('weapon-select');
            weapons.forEach(weapon => {
                const option = document.createElement('option');
                option.value = weapon;
                option.textContent = weapon;
                weaponSelect.appendChild(option);
            });
        }

        // --- TABS LOGIC ---
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                
                btn.classList.add('active');
                const tabId = btn.getAttribute('data-tab');
                document.getElementById(tabId + '-tab').style.display = 'block';
            });
        });

        // --- LOGIN LOGIC ---
        loginBtn.addEventListener('click', () => {
            const key = keyInput.value.trim();
            const today = new Date();
            
            const handleLogin = (type) => {
                userKeyType.textContent = type;
                loginScreen.classList.remove('active');
                mainScreen.classList.add('active');
                bgLogin.style.display = 'none';
                bgMain.style.display = 'block';
            };

            if (key === "XIEM-PREMIUMLOCK-12112014") {
                handleLogin("VIP KEY");
            } else if (key === "XIEM-FREE-282729220") {
                const expiryDate = new Date("2026-11-27T23:59:59");
                if (today <= expiryDate) {
                    handleLogin("FREE KEY");
                } else {
                    alert("Key FREE đã hết hạn vào ngày 27/11/2026!");
                    window.location.href = "https://okchx00-png.github.io/-Xi-m/";
                }
            } else if (key === "XIEM-PREMIUM-02837474920" || key === "XIEM-PREMIUMC7-0732984008") {
                let expiryStr = localStorage.getItem(key);
                if (!expiryStr) {
                    const expiryDate = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
                    localStorage.setItem(key, expiryDate.toISOString());
                    handleLogin("VIP 1 TUẦN");
                } else {
                    const expiryDate = new Date(expiryStr);
                    if (today <= expiryDate) {
                        handleLogin("VIP 1 TUẦN");
                    } else {
                        alert("Key VIP 1 tuần này đã hết hạn!");
                        window.location.href = "https://okchx00-png.github.io/-Xi-m/";
                    }
                }
            } else {
                alert("Key không hợp lệ! Đang chuyển hướng đến trang lấy key...");
                window.location.href = "https://okchx00-png.github.io/-Xi-m/";
            }
        });

        // --- CÁC NÚT NGOÀI ---
        loginGetKeyBtn.addEventListener('click', () => {
            window.location.href = "https://vi.anotepad.com/notes/xf957dnc";
        });

        buyKeyBtn.addEventListener('click', () => {
            window.location.href = "https://vi.anotepad.com/notes/38464ry5";
        });

        logoutBtn.addEventListener('click', () => {
            mainScreen.classList.remove('active');
            loginScreen.classList.add('active');
            keyInput.value = '';
            bgMain.style.display = 'none';
            bgLogin.style.display = 'block';
        });

        // --- TỐI ƯU SÚNG ---
        document.getElementById('optimize-all-btn').addEventListener('click', () => {
            const weaponSelect = document.getElementById('weapon-select');
            const options = weaponSelect.options;
            for (let i = 0; i < options.length; i++) {
                options[i].selected = true;
            }
            showToast("Đã tối ưu tất cả súng thành công!");
        });

        function showToast(message) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- RUN ---
        initUI();
    </script>
</body>
</html>
