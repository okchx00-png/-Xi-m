<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMLOCK HẰNG 1 VẢ 1 MẠNG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Share Tech Mono', monospace;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #05050a;
    
    /* Nền mặc định ban đầu */
    background-image: 
      linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),
      url('anh.jpg'); /* Mày có thể đổi thành link nào mày thích */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: #00ffcc;
    overflow: hidden;
    transition: background-image 0.5s ease;
  }

  /* Hiệu ứng quét màn hình (Scanlines) */
  body::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
    background-size: 100% 4px;
    z-index: 2;
    pointer-events: none;
  }

  .panel {
    position: relative;
    width: 90%;
    max-width: 420px;
    background: rgba(5, 10, 15, 0.85); 
    border: 1px solid rgba(0, 255, 204, 0.5);
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 30px rgba(0, 255, 204, 0.05);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  /* Glitch text effect */
  .glitch {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    position: relative;
    color: #00ffcc;
    text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  
  .glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
  }

  .glitch::before {
    left: 2px;
    text-shadow: -2px 0 #ff0055;
    clip: rect(44px, 450px, 56px, 0);
    animation: glitch-anim 5s infinite linear alternate-reverse;
  }

  .glitch::after {
    left: -2px;
    text-shadow: -2px 0 #00ccff;
    clip: rect(44px, 450px, 56px, 0);
    animation: glitch-anim2 5s infinite linear alternate-reverse;
  }

  @keyframes glitch-anim {
    0% { clip: rect(10px, 9999px, 83px, 0); }
    20% { clip: rect(62px, 9999px, 14px, 0); }
    40% { clip: rect(33px, 9999px, 98px, 0); }
    60% { clip: rect(86px, 9999px, 4px, 0); }
    80% { clip: rect(12px, 9999px, 45px, 0); }
    100% { clip: rect(71px, 9999px, 34px, 0); }
  }
  @keyframes glitch-anim2 {
    0% { clip: rect(65px, 9999px, 12px, 0); }
    20% { clip: rect(22px, 9999px, 76px, 0); }
    40% { clip: rect(89px, 9999px, 33px, 0); }
    60% { clip: rect(45px, 9999px, 87px, 0); }
    80% { clip: rect(12px, 9999px, 55px, 0); }
    100% { clip: rect(91px, 9999px, 23px, 0); }
  }

  .status {
    text-align: center;
    font-size: 13px;
    color: #00ff88;
    margin-bottom: 20px;
    letter-spacing: 1px;
    text-shadow: 0 0 5px rgba(0, 255, 136, 0.8);
  }

  .status.danger { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 1); }

  /* System Stats */
  .stats-container {
    margin-bottom: 24px;
    border-top: 1px dashed rgba(0, 255, 204, 0.3);
    border-bottom: 1px dashed rgba(0, 255, 204, 0.3);
    padding: 16px 0;
  }

  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .stat-row:last-child { margin-bottom: 0; }

  .stat-label { width: 90px; color: #88aa99; }

  .progress-bar {
    flex-grow: 1;
    height: 10px;
    background: rgba(0, 255, 204, 0.1);
    border: 1px solid rgba(0, 255, 204, 0.3);
    border-radius: 0;
    margin: 0 12px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: #00ffcc;
    box-shadow: 0 0 10px #00ffcc;
    transition: width 0.3s ease;
  }
  
  #ram-fill { background: #ff00ff; box-shadow: 0 0 10px #ff00ff; }

  .stat-value { width: 40px; text-align: right; color: #00ffcc; font-weight: bold; }

  /* Feature List & Toggles */
  .feature-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .feature {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 12px 14px;
    background: rgba(0, 255, 204, 0.03);
    border-left: 3px solid #00ffcc;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .feature:hover { background: rgba(0, 255, 204, 0.1); }

  .feature .toggle {
    width: 48px;
    height: 24px;
    background: #111;
    border-radius: 12px;
    position: relative;
    border: 2px solid #555;
    transition: all 0.3s;
  }

  .feature .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background: #666;
    border-radius: 50%;
    transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
  }

  .feature.on {
    border-left-color: #ff0055;
    background: rgba(255, 0, 85, 0.1);
    color: #ff0055;
    text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
  }

  .feature.on .toggle { 
    background: rgba(255, 0, 85, 0.2); 
    border-color: #ff0055; 
    box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
  }
  
  .feature.on .toggle::after { 
    left: 26px; 
    background: #ff0055; 
    box-shadow: 0 0 10px #ff0055; 
  }

  /* Buttons Container */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    width: 100%;
    padding: 16px;
    background: transparent;
    color: #00ffcc;
    border: 2px solid #00ffcc;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
    text-align: center;
  }

  .btn:hover {
    background: rgba(0, 255, 204, 0.15);
    box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.4), 0 0 15px rgba(0, 255, 204, 0.3);
  }

  .btn.active {
    background: #ff0055;
    color: #000;
    border-color: #ff0055;
    box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
    animation: pulse-btn 1s infinite alternate;
  }

  /* Nút đổi ảnh riêng */
  .btn-upload {
    padding: 10px;
    font-size: 13px;
    border-color: #00ccff;
    color: #00ccff;
  }
  
  .btn-upload:hover {
    background: rgba(0, 204, 255, 0.15);
    box-shadow: inset 0 0 20px rgba(0, 204, 255, 0.4), 0 0 15px rgba(0, 204, 255, 0.3);
  }

  @keyframes pulse-btn {
    from { box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
    to { box-shadow: 0 0 30px rgba(255, 0, 85, 1); }
  }

</style>
</head>
<body>

  <div class="panel">
    <div class="glitch" data-text="AIMLOCK HẰNG 1 VẢ 1 MẠNG">AIMLOCK HẰNG 1 VẢ 1 MẠNG</div>
    <div class="status" id="status">STATUS: SAFE [UNDETECTED]</div>

    <div class="stats-container">
      <div class="stat-row">
        <div class="stat-label">CPU LOAD</div>
        <div class="progress-bar"><div class="progress-fill" id="cpu-fill"></div></div>
        <div class="stat-value" id="cpu-value">0%</div>
      </div>
      <div class="stat-row">
        <div class="stat-label">RAM MEMORY</div>
        <div class="progress-bar"><div class="progress-fill" id="ram-fill"></div></div>
        <div class="stat-value" id="ram-value">0%</div>
      </div>
    </div>

    <div class="feature-list" id="features">
      <div class="feature" data-feature="norecoil">
        <span>[01] NO RECOIL</span>
        <div class="toggle"></div>
      </div>
      <div class="feature" data-feature="aimlock">
        <span>[02] AIMLOCK</span>
        <div class="toggle"></div>
      </div>
      <div class="feature" data-feature="nhetam">
        <span>[03] NHẸ TÂM</span>
        <div class="toggle"></div>
      </div>
      <div class="feature" data-feature="aimco">
        <span>[04] AIM CỔ</span>
        <div class="toggle"></div>
      </div>
      <div class="feature" data-feature="aimbody">
        <span>[05] AIMBODY (FULL VÀNG)</span>
        <div class="toggle"></div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn" id="main-btn">KÍCH HOẠT HỆ THỐNG</button>
      
      <!-- Nút đổi ảnh nền -->
      <label for="bg-upload" class="btn btn-upload">TẢI ẢNH NỀN TỪ MÁY</label>
      <input type="file" id="bg-upload" accept="image/*" style="display: none;">
    </div>
  </div>

<script>
  // --- XỬ LÝ ĐỔI ẢNH NỀN ---
  const bgUploadInput = document.getElementById('bg-upload');
  
  // Kiểm tra xem trước đó mày có lưu ảnh nào chưa
  const savedBg = localStorage.getItem('aimlockBg');
  if (savedBg) {
    document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url(${savedBg})`;
  }

  // Lắng nghe sự kiện chọn ảnh
  bgUploadInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Img = event.target.result;
        // Đổi ảnh nền
        document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url(${base64Img})`;
        // Lưu vào bộ nhớ trình duyệt
        localStorage.setItem('aimlockBg', base64Img);
      };
      reader.readAsDataURL(file);
    }
  });

  // --- XỬ LÝ THÔNG SỐ CPU / RAM ---
  const cpuFill = document.getElementById('cpu-fill');
  const ramFill = document.getElementById('ram-fill');
  const cpuVal = document.getElementById('cpu-value');
  const ramVal = document.getElementById('ram-value');

  function updateStats() {
    let cpu = Math.floor(Math.random() * 70) + 15;
    let ram = Math.floor(Math.random() * 50) + 40;

    cpuFill.style.width = cpu + '%';
    cpuVal.textContent = cpu + '%';

    ramFill.style.width = ram + '%';
    ramVal.textContent = ram + '%';
  }

  setInterval(updateStats, 800);
  updateStats(); 

  // --- XỬ LÝ TOGGLE ---
  const features = document.querySelectorAll('.feature');
  features.forEach(feature => {
    feature.addEventListener('click', () => {
      feature.classList.toggle('on');
    });
  });

  // --- XỬ LÝ NÚT KÍCH HOẠT TỔNG ---
  const mainBtn = document.getElementById('main-btn');
  const statusEl = document.getElementById('status');

  mainBtn.addEventListener('click', () => {
    mainBtn.classList.toggle('active');
    const isActive = mainBtn.classList.contains('active');
    
    if (isActive) {
      mainBtn.textContent = 'HỆ THỐNG ĐÃ ACTIVE';
      statusEl.textContent = 'STATUS: RAGE MODE [ACTIVE]';
      statusEl.classList.add('danger');
      features.forEach(f => f.classList.add('on'));
    } else {
      mainBtn.textContent = 'KÍCH HOẠT HỆ THỐNG';
      statusEl.textContent = 'STATUS: SAFE [UNDETECTED]';
      statusEl.classList.remove('danger');
      features.forEach(f => f.classList.remove('on'));
    }
  });
</script>
</body>
</html>
